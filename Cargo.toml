[package]
name = "foxhole"
version = "0.4.0"
edition = "2021"
description = "A Blazingly-fast http framework"
license = "MIT"
repository = "https://github.com/Kay-Conte/foxhole-rs/"
categories = ["web-programming::http-server", "web-programming"]
rust-version = "1.70.0"

[features]
default = ["date"]

tls = ["rustls"]
date = ["chrono"]
websocket = ["sha1", "base64"]

[dependencies]
http = "1.4.0"
rustls = { version = "0.23.36", optional = true }

chrono = { version = "0.4.43", optional = true }

sha1 = { version = "0.10.6", optional = true }
base64 = { version = "0.22.1", optional = true }

[dev-dependencies]
rustls-pemfile = "2"
